<!doctype html>
<html><head><title>Apply</title></head><body>
<h1>Database Administrator (PostgreSQL)</h1>
<form id="application_form" action="thanks.html" method="get">
  <div><label for="first_name">First Name *</label><input id="first_name" name="first_name" required></div>
  <div><label for="last_name">Last Name *</label><input id="last_name" name="last_name" required></div>
  <div><label for="email">Email *</label><input id="email" name="email" type="email" required></div>
  <div><label for="phone">Phone</label><input id="phone" name="phone" type="tel"></div>
  <div><label for="resume">Resume/CV *</label><input id="resume" name="resume" type="file" required></div>
  <div><label for="cover">Cover Letter</label><textarea id="cover" name="cover"></textarea></div>
  <div><label for="li">LinkedIn Profile</label><input id="li" name="li"></div>
  <div><label for="hear">How did you hear about this job? *</label>
    <select id="hear" name="hear" required><option value="">Select...</option>
      <option>Company careers page</option><option>Referral</option><option>Other</option></select></div>
  <fieldset><legend>Will you now or in the future require visa sponsorship? *</legend>
    <label><input type="radio" name="sponsor" value="yes" required> Yes</label>
    <label><input type="radio" name="sponsor" value="no"> No</label></fieldset>
  <div><label><input type="checkbox" name="consent" required> I agree to the privacy policy *</label></div>
  <!--EXTRA-->
  <button type="submit">Submit application</button>
</form>
</body></html>
