# Ready-made profile for an open-source Database Administrator (MySQL /
# MariaDB) with ~2 years 2 months of experience, targeting Bengaluru and Chennai.
#
#   cp profile.dba.example.yaml profile.yaml   # then fill in the personal: section
#
# Edit the skills lists so they match what's actually on your resume. The
# matcher and the optional Claude answers only use what you put here.

personal:
  first_name: Your
  last_name: Name
  email: you@example.com
  phone: "+91 90000 00000"
  location: "Bengaluru, India"
  linkedin: "https://www.linkedin.com/in/your-handle"
  github: ""
  website: ""
  resume_path: "./resume.pdf"
  current_company: "Your Current Company"
  years_experience: 2.17               # 2 years 2 months
  work_authorization: "Indian citizen, authorized to work in India"
  requires_sponsorship: false

search:
  titles:
    - Database Administrator            # "DBA" in a title is treated as the same thing
    - Database Engineer
    - MySQL DBA
    - MariaDB DBA
    - Open Source DBA
    - PostgreSQL DBA
    - Database Reliability Engineer
  keywords: ["mysql dba", "database administrator"]
  locations: ["Bengaluru", "Chennai"]  # "Bangalore" and "Madras" also match
  include_remote: false                # set true to also get remote-in-India roles
  remote_only: false
  min_salary_usd: 0
  # Open-source databases only: reject any posting that doesn't mention
  # MySQL or MariaDB (the core skills below).
  require_core_skill: true
  # The job title itself must be about databases. This stops "Site Reliability
  # Engineer" or "Software Engineer" roles that merely mention MySQL.
  required_title_words: ["database", "databases", "dba", "db", "mysql", "mariadb", "postgres", "postgresql", "sql"]
  exclude_title_keywords: [
    # too senior for ~2 years of experience
    "senior", "sr", "principal", "staff", "architect", "lead", "manager", "director", "head", "intern",
    # proprietary databases you don't work with
    "oracle", "sql server", "mssql", "db2", "sybase", "teradata",
  ]
  exclude_keywords: []
  exclude_companies: []

# Weighting: core counts 2, other counts 1, basic counts 0.5.
skills:
  core: ["MySQL", "MariaDB"]                       # excellent
  other: ["PostgreSQL", "Linux", "Shell Scripting", # intermediate / good working knowledge
          "Automation", "Monitoring", "Alerting", "Prometheus", "Grafana",
          # Typical MySQL DBA duties. Keep only the ones you've actually done;
          # Claude uses this list when answering screening questions.
          "Replication", "Backup and Recovery", "Performance Tuning", "High Availability"]
  basic: ["MongoDB", "ArangoDB", "Python"]         # basic knowledge

# Companies whose careers pages run on Greenhouse / Lever / Ashby and that have
# offices in Bengaluru or Chennai. These are STARTING POINTS, not a vetted
# list: a wrong slug is logged as FAILED and skipped. To add a company, open
# its careers page. If the link goes to boards.greenhouse.io/<slug>,
# jobs.lever.co/<slug> or jobs.ashbyhq.com/<slug>, add <slug> below.
sources:
  greenhouse: ["razorpaysoftwareprivatelimited", "devrev", "orioninnovationnaukri",
               "gravitonresearchcapital", "alphagrepsecurities", "accordionindia",
               "stripe", "databricks", "rubrik", "cloudflare", "mongodb", "okta"]
  lever: ["meesho"]           # Meesho has posted "Database Engineer I" roles in Bengaluru
  ashby: ["confluent"]
  remotive: false
  remoteok: false

apply:
  min_score: 55
  auto_approve: false        # review matches with `list` and `show`, then `approve`
  dry_run: true              # fill forms and take screenshots, but don't submit until you pass --submit
  max_per_run: 10
  headless: true
  use_llm_for_cover_letter: false
  use_llm_for_questions: false

answers:
  "how did you hear": "Company careers page"
  "sponsorship": "No"
  "authorized to work": "Yes"
  "willing to relocate": "Yes"
  "notice period": "30 days"
  "years of experience": "2"
  # Fill these in. If one is left empty and a form requires it, that job is
  # marked needs_manual instead of being sent with a blank or made-up answer.
  "current ctc": ""
  "expected ctc": ""
  "salary expectation": ""

cover_letter_template: |
  Hi {company} team,

  I'm applying for the {title} role. I have {years}+ years of hands-on
  experience as a DBA working with {top_skills}, covering day-to-day
  administration, backup and recovery, and performance tuning.
  I'd welcome the chance to do the same for {company}.

  Thanks for your time,
  {first_name} {last_name}
